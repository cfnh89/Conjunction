<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Gambler: Conjunctions</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>
    <style>
        :root {
            --felt: #1a472a;
            --wood: #3d2b1f;
            --card-white: #ffffff;
            --gold: #ffd700;
            --accent: #4caf50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #121212;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Table Structure */
        #table {
            position: relative;
            width: 95vw;
            max-width: 1100px;
            height: 85vh;
            background: var(--felt);
            border: 22px solid var(--wood);
            border-radius: 220px;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.9), 0 30px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Opponents */
        .player-seat {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 5;
        }

        .avatar-frame {
            position: relative;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #444, #222);
            border: 3px solid #888;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .thinking-bubble {
            position: absolute;
            top: -15px;
            right: -15px;
            background: white;
            color: black;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        .name-tag {
            background: rgba(0,0,0,0.8);
            color: var(--gold);
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .opponent-cards { display: flex; margin-top: 5px; }
        .card-back {
            width: 25px;
            height: 38px;
            background: #b22222;
            border: 1px solid white;
            border-radius: 3px;
            margin-left: -15px;
            background-image: repeating-linear-gradient(45deg, #800 0, #800 2px, #b22222 2px, #b22222 10px);
            box-shadow: 1px 0 3px rgba(0,0,0,0.3);
        }

        #opp-top { top: -25px; }
        #opp-left { left: 40px; transform: rotate(90deg); }
        #opp-right { right: 40px; transform: rotate(-90deg); }

        /* Central Monitor */
        #game-monitor {
            width: 420px;
            height: 220px;
            background: #050505;
            border: 10px solid #2a2a2a;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,255,100,0.15), inset 0 0 50px rgba(0,255,100,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        #display-text {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #00ff41;
            font-size: 1.1rem;
            line-height: 1.4;
            text-shadow: 0 0 5px rgba(0,255,65,0.5);
            padding: 0 10px;
        }

        #score-display {
            position: absolute;
            top: 12px;
            right: 15px;
            color: var(--gold);
            font-size: 1rem;
            font-weight: bold;
        }

        /* Player's Area & Hand */
        #player-area {
            position: absolute;
            bottom: -65px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        #hand {
            display: flex;
            gap: 8px;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            width: 80px;
            height: 115px;
            background: var(--card-white);
            color: #222;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.5s;
            text-align: center;
            padding: 5px;
            border: 1px solid #ddd;
        }

        .card:hover {
            transform: translateY(-40px) scale(1.1) rotate(2deg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .card.played-anim {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Overlay & Leaderboard */
        #msg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
        }

        .setup-container {
            background: #222;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .avatar-option {
            font-size: 2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .avatar-option.selected {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }

        input#player-name-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1.1rem;
            margin-top: 5px;
            background: #333;
            color: white;
            text-align: center;
        }

        .leaderboard {
            margin-top: 20px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            background: #111;
            border-radius: 10px;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            font-size: 0.85rem;
        }

        .btn {
            background: var(--gold);
            color: black;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 0 #b8860b;
        }

        #feedback {
            margin-top: 10px;
            font-weight: 800;
            height: 20px;
            font-size: 0.8rem;
        }

        @media (max-width: 800px) {
            #hand { gap: 4px; flex-wrap: wrap; justify-content: center; padding: 5px; }
            .card { width: 55px; height: 80px; font-size: 0.65rem; }
            #game-monitor { width: 280px; height: 180px; }
            #opp-left, #opp-right { display: none; }
        }
    </style>
</head>
<body>

    <div id="table">
        <div class="player-seat" id="opp-top">
            <div class="avatar-frame">👴<div class="thinking-bubble">Hmm...</div></div>
            <div class="name-tag">Professor Punctual</div>
            <div class="opponent-cards" id="cards-top"></div>
        </div>

        <div class="player-seat" id="opp-left">
            <div class="avatar-frame">👩‍💼<div class="thinking-bubble">Quickly!</div></div>
            <div class="name-tag">Manager Mary</div>
            <div class="opponent-cards" id="cards-left"></div>
        </div>

        <div class="player-seat" id="opp-right">
            <div class="avatar-frame">🕵️‍♂️<div class="thinking-bubble">Gotcha...</div></div>
            <div class="name-tag">Detective Dash</div>
            <div class="opponent-cards" id="cards-right"></div>
        </div>

        <div id="game-monitor">
            <div id="score-display">SCORE: 0</div>
            <div id="display-text">PLEASE LOGIN...</div>
            <div id="feedback"></div>
        </div>

        <div id="player-area">
            <div id="hand"></div>
            <div id="user-avatar-seat" class="avatar-frame" style="margin-bottom: 5px; border-color: var(--gold);">👤</div>
            <div id="user-name-tag" class="name-tag">PLAYER</div>
        </div>
    </div>

    <div id="msg-overlay">
        <div class="setup-container" id="menu-content">
            <h2 id="overlay-title" style="color: var(--gold); margin-bottom: 10px;">CONJUNCTION CASINO</h2>
            
            <div id="setup-fields">
                <p style="font-size: 0.9rem;">Pick an avatar & name to join the leaderboard:</p>
                <div class="avatar-selection">
                    <span class="avatar-option selected" data-emoji="🧑‍🎓">🧑‍🎓</span>
                    <span class="avatar-option" data-emoji="👩‍🔬">👩‍🔬</span>
                    <span class="avatar-option" data-emoji="🥷">🥷</span>
                    <span class="avatar-option" data-emoji="🧛">🧛</span>
                </div>
                <input type="text" id="player-name-input" placeholder="Your Name" maxlength="12">
            </div>

            <div id="leaderboard-container" class="leaderboard" style="display:none;">
                <p style="font-weight: bold; border-bottom: 1px solid var(--gold); margin-bottom: 5px;">TOP PLAYERS</p>
                <div id="leaderboard-list">Loading...</div>
            </div>

            <p id="overlay-body" style="margin-top: 10px; display: none; font-size: 0.9rem;"></p>
            <button class="btn" id="start-btn">JOIN GAME</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, addDoc, onSnapshot, query, getDocs, doc } from "firebase/firestore";

        // Firebase Setup
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'conjunction-card-battle';

        // Local State
        const conjunctions = ["and", "but", "or", "so", "because", "although", "unless", "since", "while", "yet"];
        const questionPool = [
            { sentence: "I like coffee, ___ my sister prefers tea.", answer: "but" },
            { sentence: "He stayed in bed ___ he felt very sick.", answer: "because" },
            { sentence: "Would you like a burger ___ a pizza?", answer: "or" },
            { sentence: "___ it was a holiday, the shops were closed.", answer: "since" },
            { sentence: "I missed the bus, ___ I had to walk to school.", answer: "so" },
            { sentence: "He bought bread, milk ___ some eggs.", answer: "and" },
            { sentence: "___ she was tired, she finished her project.", answer: "although" },
            { sentence: "Don't go out ___ you finish your dinner.", answer: "unless" },
            { sentence: "I read a book ___ I was waiting for the train.", answer: "while" },
            { sentence: "The movie was long, ___ it was very exciting.", answer: "yet" },
            { sentence: "I'll go to the park ___ it stops raining.", answer: "unless" },
            { sentence: "She is smart, ___ she is also very kind.", answer: "and" },
            { sentence: "We can go to the beach ___ the mountains.", answer: "or" },
            { sentence: "___ it was late, he kept on working.", answer: "although" },
            { sentence: "I studied hard, ___ he failed the test.", answer: "yet" },
            { sentence: "He was hungry, ___ he made a sandwich.", answer: "so" },
            { sentence: "___ you study, you will fail the exam.", answer: "unless" },
            { sentence: "I haven't eaten ___ breakfast.", answer: "since" }
        ];

        let gameQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let canPlay = false;
        let selectedEmoji = '🧑‍🎓';
        let user = null;

        // DOM Elements
        const displayText = document.getElementById('display-text');
        const feedbackText = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const handContainer = document.getElementById('hand');
        const overlay = document.getElementById('msg-overlay');
        const startBtn = document.getElementById('start-btn');
        const nameInput = document.getElementById('player-name-input');
        const lbList = document.getElementById('leaderboard-list');

        // Auth initialization
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        initAuth();

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                fetchLeaderboard();
                displayText.innerText = "READY TO START";
            }
        });

        // UI Listeners
        document.querySelectorAll('.avatar-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedEmoji = opt.dataset.emoji;
            };
        });

        startBtn.onclick = () => {
            if (!user) return;
            const name = nameInput.value.trim() || "ANON";
            document.getElementById('user-name-tag').innerText = name.toUpperCase();
            document.getElementById('user-avatar-seat').innerText = selectedEmoji;
            overlay.style.display = 'none';
            resetGame();
        };

        function fetchLeaderboard() {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
            onSnapshot(q, (snapshot) => {
                const scores = [];
                snapshot.forEach(doc => scores.push(doc.data()));
                // Memory sort
                scores.sort((a, b) => b.score - a.score);
                lbList.innerHTML = scores.slice(0, 5).map(s => `
                    <div class="leaderboard-entry">
                        <span>${s.avatar} ${s.name}</span>
                        <span>${s.score} pts</span>
                    </div>
                `).join('') || "No scores yet.";
                document.getElementById('leaderboard-container').style.display = 'block';
            }, (err) => console.error(err));
        }

        async function saveScore() {
            if (!user) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'scores'), {
                    name: nameInput.value.trim() || "ANON",
                    score: score,
                    avatar: selectedEmoji,
                    timestamp: Date.now()
                });
            } catch (e) {
                console.error("Score not saved:", e);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setupOpponents() {
            ['top', 'left', 'right'].forEach(pos => {
                const container = document.getElementById(`cards-${pos}`);
                container.innerHTML = '';
                for(let i=0; i<6; i++) {
                    const card = document.createElement('div');
                    card.className = 'card-back';
                    container.appendChild(card);
                }
            });
        }

        function resetGame() {
            setupOpponents();
            gameQuestions = shuffleArray([...questionPool]).slice(0, 10);
            currentQuestion = 0;
            score = 0;
            scoreDisplay.innerText = "SCORE: 0";
            renderHand();
            nextRound();
        }

        function renderHand() {
            handContainer.innerHTML = '';
            conjunctions.forEach(conj => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = conj;
                card.onclick = (e) => handleCardPlay(conj, card);
                handContainer.appendChild(card);
            });
        }

        function nextRound() {
            if (currentQuestion >= gameQuestions.length) {
                gameOver();
                return;
            }
            canPlay = true;
            feedbackText.innerText = "";
            displayText.style.color = "#00ff41";
            displayText.innerText = gameQuestions[currentQuestion].sentence;
        }

        function handleCardPlay(selectedConj, cardEl) {
            if (!canPlay) return;
            canPlay = false;

            const rect = cardEl.getBoundingClientRect();
            const monitorRect = document.getElementById('game-monitor').getBoundingClientRect();
            const clone = cardEl.cloneNode(true);
            clone.classList.add('played-anim');
            clone.style.left = rect.left + 'px';
            clone.style.top = rect.top + 'px';
            clone.style.width = rect.width + 'px';
            clone.style.height = rect.height + 'px';
            document.body.appendChild(clone);

            cardEl.style.opacity = '0';
            cardEl.style.pointerEvents = 'none';

            setTimeout(() => {
                clone.style.left = (monitorRect.left + 150) + 'px';
                clone.style.top = (monitorRect.top + 50) + 'px';
                clone.style.transform = 'scale(0.3) rotate(360deg)';
                clone.style.opacity = '0';
            }, 10);

            const correct = gameQuestions[currentQuestion].answer;
            const isCorrect = selectedConj.toLowerCase() === correct;

            setTimeout(() => {
                clone.remove();
                cardEl.remove();
                if (isCorrect) {
                    score += 10;
                    scoreDisplay.innerText = `SCORE: ${score}`;
                    displayText.innerText = gameQuestions[currentQuestion].sentence.replace("___", selectedConj.toUpperCase());
                    displayText.style.color = "#4caf50";
                    feedbackText.innerText = "+10 POINTS!";
                    feedbackText.style.color = "#4caf50";
                } else {
                    displayText.style.color = "#f44336";
                    feedbackText.innerText = `WRONG! ANSWER: ${correct.toUpperCase()}`;
                    feedbackText.style.color = "#f44336";
                }
                setTimeout(() => {
                    currentQuestion++;
                    nextRound();
                }, 1500);
            }, 600);
        }

        function gameOver() {
            saveScore();
            overlay.style.display = 'flex';
            document.getElementById('setup-fields').style.display = 'none';
            document.getElementById('overlay-title').innerText = score === 100 ? "JACKPOT!" : "GAME OVER";
            const body = document.getElementById('overlay-body');
            body.style.display = 'block';
            body.innerText = `Final Score: ${score}/100. Check the leaderboard!`;
            startBtn.innerText = "PLAY AGAIN";
            startBtn.onclick = () => location.reload();
        }
    </script>
</body>
</html>
